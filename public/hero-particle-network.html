<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indian AgriTech — Particle Hero Demo</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #fcf9f1;
        color: #1a1a1a;
      }

      .hero {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 92vh;
        overflow: hidden;
        isolation: isolate;
      }

      /* Layer 0: dark green gradient base */
      .hero__gradient {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 55%, #1b4332 100%);
      }

      /* Layer 0: tsParticles canvas */
      #tsparticles {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
      }

      /* Layer 1: hero content */
      .hero__content {
        position: relative;
        z-index: 1;
        max-width: 42rem;
        padding: 2rem 1.5rem;
        text-align: center;
        color: #f1f8e9;
      }

      .hero__content h1 {
        font-size: clamp(2rem, 5vw + 0.5rem, 3.5rem);
        font-weight: 700;
        line-height: 1.15;
        text-shadow: 0 2px 24px rgba(0, 0, 0, 0.45), 0 1px 4px rgba(0, 0, 0, 0.35);
      }

      .hero__content h1 span {
        color: #a5d6a7;
      }

      .hero__content p {
        margin-top: 1.25rem;
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.7;
        color: rgba(241, 248, 233, 0.88);
        text-shadow: 0 1px 12px rgba(0, 0, 0, 0.4);
      }

      .hero__cta {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 2rem;
        padding: 0.85rem 1.75rem;
        border: none;
        border-radius: 999px;
        background: #f9a825;
        color: #1b4332;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-decoration: none;
        cursor: pointer;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.25);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .hero__cta:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
      }

      /* Smaller wave divider */
      .hero__waves {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 2;
        height: clamp(3rem, 6vw, 4.5rem);
        pointer-events: none;
        overflow: hidden;
      }

      .hero__waves svg {
        position: absolute;
        bottom: 0;
        width: 200%;
        height: 100%;
        animation: wave-drift 18s linear infinite;
      }

      .hero__waves .wave-back {
        opacity: 0.35;
        fill: #1b5e20;
        animation-duration: 22s;
      }

      .hero__waves .wave-mid {
        opacity: 0.55;
        fill: #388e3c;
        animation-duration: 16s;
      }

      .hero__waves .wave-front {
        opacity: 1;
        fill: #f1f8e9;
        animation-duration: 12s;
        width: 100%;
        left: 0;
      }

      @keyframes wave-drift {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-50%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hero__waves svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <section class="hero" id="hero">
      <div class="hero__gradient" aria-hidden="true"></div>
      <div id="tsparticles" aria-hidden="true"></div>

      <div class="hero__content">
        <h1>Growing a <span>Greener</span> Tomorrow</h1>
        <p>
          Sustainable crop solutions for Indian farmers — science-backed nutrition and protection
          for healthier fields.
        </p>
        <a href="#explore" class="hero__cta">Explore Our Products →</a>
      </div>

      <div class="hero__waves" aria-hidden="true">
        <svg class="wave-back" viewBox="0 0 2400 80" preserveAspectRatio="none">
          <path
            d="M0,48 C200,72 400,24 600,48 C800,72 1000,24 1200,48 C1400,72 1600,24 1800,48 C2000,72 2200,24 2400,48 L2400,80 L0,80 Z"
          />
        </svg>
        <svg class="wave-mid" viewBox="0 0 2400 80" preserveAspectRatio="none">
          <path
            d="M0,48 C200,72 400,24 600,48 C800,72 1000,24 1200,48 C1400,72 1600,24 1800,48 C2000,72 2200,24 2400,48 L2400,80 L0,80 Z"
          />
        </svg>
        <svg class="wave-front" viewBox="0 0 1200 80" preserveAspectRatio="none" width="100%">
          <path
            d="M0,48 C200,72 400,24 600,48 C800,72 1000,24 1200,48 L1200,80 L0,80 Z"
          />
        </svg>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
    <script>
      (async function () {
        await tsParticles.load("tsparticles", {
          fullScreen: { enable: false },
          fpsLimit: 60,
          detectRetina: true,
          particles: {
            number: { value: 90 },
            color: { value: ["#4CAF50", "#81C784", "#ffffff"] },
            opacity: {
              value: { min: 0.6, max: 0.8 },
            },
            size: {
              value: { min: 1, max: 4 },
            },
            links: {
              enable: true,
              distance: 150,
              color: "#81C784",
              opacity: 0.5,
              width: 1,
            },
            move: {
              enable: true,
              speed: 0.6,
              direction: "none",
              random: true,
              out_mode: "bounce",
            },
          },
          interactivity: {
            detect_on: "parent",
            events: {
              onhover: { enable: true, mode: "repulse" },
              onclick: { enable: true, mode: "push" },
            },
            modes: {
              repulse: {
                distance: 120,
                duration: 0.35,
              },
              push: {
                quantity: 8,
              },
            },
          },
        });
      })();
    </script>
  </body>
</html>
